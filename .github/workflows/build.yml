name: Vyhledávací index

on:
  schedule:
    - cron: '15 2 * * *'   # každou noc (cca 3:15–4:15 českého času)
  workflow_dispatch:        # ruční spuštění tlačítkem
    inputs:
      rychle:
        description: 'Jen přepnout verzi (rollback): index převzít z webu, nestavět znovu'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.mjs   # testy vyhledávání; když selžou, nic se nezveřejní
      - if: ${{ !inputs.rychle }}
        run: node build-index.mjs public
      - if: ${{ inputs.rychle }}   # ~1 min: search-v3.js podle package.json → psearch.stable, index beze změny
        run: node release.mjs public --index-from https://dotejdne-cmd.github.io/promontaz-search/index.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
