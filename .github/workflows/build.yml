name: Vyhledávací index

on:
  schedule:
    - cron: '15 2 * * *'   # každou noc (cca 3:15–4:15 českého času)
  workflow_dispatch:        # ruční spuštění tlačítkem
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.mjs   # testy vyhledávání; když selžou, nic se nezveřejní
      - run: node build-index.mjs public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
